name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # La app de campo vive en el mismo repositorio pero se publica en otro sitio
    # (CloudFront, ver .github/workflows/radar.yml). Sin esto, tocar el radar
    # reconstruía y republicaba la tienda sin que hubiera cambiado nada suyo.
    #
    # El filtro solo salta la ejecución cuando *todos* los archivos del push
    # están en esta lista: un cambio que mezcle tienda y radar sigue desplegando
    # la tienda, que es lo que debe pasar.
    paths-ignore:
      - "radar/**"
      - "RADAR_PLAN.md"
      - ".github/workflows/aws.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        # PAGES=1 activa el basePath del repositorio. Sin esta variable la tienda se
        # compila para la raíz de un dominio, que es como se publica en CloudFront.
        #
        # Las tres variables de abajo son opcionales y viven en las *variables*
        # del repositorio (Settings → Secrets and variables → Actions →
        # Variables), no en el código: el identificador del pixel y el enlace de
        # cobro cambian sin tocar la tienda, y el webhook apunta a un servicio
        # que se puede sustituir. Vacías, la tienda funciona igual: no carga el
        # pixel, no manda a Clip y avisa solo por WhatsApp.
        #
        # `IMAGENES` es la URL de CloudFront de las fotos del catálogo (salida
        # `cdnImagenes` del despliegue a AWS). Vacía, el build procesa las fotos
        # de `catalogo/fotos/` y las publica junto con la copia de Pages.
        env:
          PAGES: "1"
          NEXT_PUBLIC_IMAGENES: ${{ vars.IMAGENES }}
          NEXT_PUBLIC_META_PIXEL: ${{ vars.META_PIXEL }}
          NEXT_PUBLIC_CLIP_LINK: ${{ vars.CLIP_LINK }}
          NEXT_PUBLIC_WEBHOOK_PEDIDOS: ${{ vars.WEBHOOK_PEDIDOS }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
