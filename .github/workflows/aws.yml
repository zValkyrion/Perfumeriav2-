name: Desplegar sitio a AWS

# Cada push a main actualiza CloudFront. El repositorio sigue siendo la fuente de
# verdad: AWS solo recibe lo que ya está en git.
#
# Sin filtro de rutas, a diferencia del workflow de Pages: esta distribución
# sirve **las dos** apps —la tienda en la raíz y la de campo en /radar—, así que
# un cambio en cualquiera de las dos tiene que llegar hasta aquí.
on:
  push:
    branches: [main]
  workflow_dispatch:

# `id-token` es lo que permite pedirle a AWS un token temporal por OIDC. Así no
# hay llaves de acceso guardadas en GitHub: nada que rotar, nada que filtrar.
permissions:
  id-token: write
  contents: read

# Dos despliegues a la vez dejan el estado de SST bloqueado y el segundo falla.
concurrency:
  group: radar-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 y no 20: `scripts/probar-tienda.ts` se ejecuta directo, y quitar
          # los tipos sin compilar solo viene de serie desde Node 22.18.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            radar/package-lock.json

      # Las dos apps se compilan: la tienda desde la raíz del repositorio y la de
      # campo desde radar/. Cada una tiene sus propias dependencias.
      - name: Instalar dependencias de la tienda
        working-directory: .
        run: npm ci

      - name: Instalar dependencias del radar
        run: npm ci

      - name: Pedir credenciales temporales a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::637423567003:role/Elrey_despliegue_github
          aws-region: us-east-1

      - name: Desplegar
        run: npx sst deploy --stage produccion

      # Desplegar no es funcionar. Si la API queda rota, el workflow falla y
      # aparece en rojo en vez de descubrirse en la calle al día siguiente.
      - name: Probar la API en producción
        env:
          RADAR_PIN: ${{ secrets.RADAR_PIN }}
        run: npm run probar

      # El carrito y los pedidos no se pueden probar por HTTP sin la contraseña
      # de una cuenta, que no vive aquí. Esto entra por debajo, contra la tabla
      # real, y verifica lo que de verdad importa: el saneado de lo que manda el
      # navegador y que las filas de usuario no se cuelen entre las fichas.
      - name: Probar el carrito y los pedidos
        run: npm run probar-tienda
