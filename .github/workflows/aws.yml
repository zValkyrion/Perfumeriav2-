name: Desplegar sitio a AWS

# Cada push a main actualiza CloudFront. El repositorio sigue siendo la fuente de
# verdad: AWS solo recibe lo que ya está en git.
#
# Sin filtro de rutas, a diferencia del workflow de Pages: esta distribución
# sirve **las dos** apps —la tienda en la raíz y la de campo en /radar—, así que
# un cambio en cualquiera de las dos tiene que llegar hasta aquí.
on:
  push:
    branches: [main]
  workflow_dispatch:

# `id-token` es lo que permite pedirle a AWS un token temporal por OIDC. Así no
# hay llaves de acceso guardadas en GitHub: nada que rotar, nada que filtrar.
permissions:
  id-token: write
  contents: read

# Dos despliegues a la vez dejan el estado de SST bloqueado y el segundo falla.
concurrency:
  group: radar-produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 22 y no 20: `scripts/probar-tienda.ts` se ejecuta directo, y quitar
          # los tipos sin compilar solo viene de serie desde Node 22.18.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            radar/package-lock.json

      # Las dos apps se compilan: la tienda desde la raíz del repositorio y la de
      # campo desde radar/. Cada una tiene sus propias dependencias.
      - name: Instalar dependencias de la tienda
        working-directory: .
        run: npm ci

      - name: Instalar dependencias del radar
        run: npm ci

      # La tienda y la API cobran con la misma función (`compartido/`). Si sus
      # pruebas fallan no se despliega nada: cobrar mal es peor que no desplegar.
      - name: Probar las reglas de precio
        working-directory: .
        run: npm run probar:precios

      # El CSV del catálogo se valida antes de tocar AWS: un agotado que se
      # cobre o una nota interna publicada no deben llegar a producción.
      - name: Probar el catálogo
        working-directory: .
        run: npm run probar:catalogo

      - name: Pedir credenciales temporales a AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::637423567003:role/Elrey_despliegue_github
          aws-region: us-east-1

      # El catálogo de la tienda vive en DynamoDB y S3. Lo editan el panel
      # (/radar/catalogo) y `catalogo/*.csv`; la carga del CSV **no pisa** lo del
      # panel: solo aplica los campos que cambiaron en el CSV desde la carga
      # anterior. Va **antes** del despliegue porque el build de la tienda
      # publica lo que devuelve `GET /catalogo`: cargado después, la tienda
      # saldría con el catálogo anterior. Es idempotente, y `--si-existe` la
      # salta sin error la primera vez, cuando la tabla todavía no existe.
      #
      # Este workflow también lo lanza el botón «Publicar» del panel (y la
      # publicación automática) con `workflow_dispatch`.
      - name: Cargar el catálogo (antes del build)
        run: npx sst shell --stage produccion -- npm --prefix .. run catalogo:subir -- --si-existe

      - name: Desplegar
        # Mismas variables opcionales que el workflow de Pages: `sst.config.ts`
        # las lee de aquí y se las pasa a la compilación de la tienda. Si están
        # vacías, la tienda se publica sin pixel, sin enlace de Clip y avisando
        # de los pedidos solo por WhatsApp.
        env:
          NEXT_PUBLIC_META_PIXEL: ${{ vars.META_PIXEL }}
          NEXT_PUBLIC_CLIP_LINK: ${{ vars.CLIP_LINK }}
          NEXT_PUBLIC_WEBHOOK_PEDIDOS: ${{ vars.WEBHOOK_PEDIDOS }}
        run: npx sst deploy --stage produccion

      # La segunda pasada solo hace algo en el primer despliegue (la tabla acaba
      # de nacer) o si alguien cambió el catálogo entre las dos. En esos casos la
      # tienda se compiló sin él y se reconstruye.
      - name: Cargar el catálogo (después del despliegue)
        id: catalogo
        run: npx sst shell --stage produccion -- npm --prefix .. run catalogo:subir

      - name: Reconstruir la tienda con el catálogo recién cargado
        if: steps.catalogo.outputs.cambios == 'true'
        env:
          NEXT_PUBLIC_META_PIXEL: ${{ vars.META_PIXEL }}
          NEXT_PUBLIC_CLIP_LINK: ${{ vars.CLIP_LINK }}
          NEXT_PUBLIC_WEBHOOK_PEDIDOS: ${{ vars.WEBHOOK_PEDIDOS }}
        run: npx sst deploy --stage produccion

      # Qué catálogo quedó publicado: el panel lo compara con el último cambio
      # para decir si hay algo pendiente, y la publicación automática para
      # saber si tiene que volver a compilar.
      - name: Anotar el catálogo publicado
        run: npx sst shell --stage produccion -- npm --prefix .. run catalogo:publicado

      # Desplegar no es funcionar. Si la API queda rota, el workflow falla y
      # aparece en rojo en vez de descubrirse en la calle al día siguiente.
      - name: Probar la API en producción
        env:
          RADAR_PIN: ${{ secrets.RADAR_PIN }}
        run: npm run probar

      # El carrito y los pedidos no se pueden probar por HTTP sin la contraseña
      # de una cuenta, que no vive aquí. Esto entra por debajo, contra la tabla
      # real, y verifica lo que de verdad importa: el saneado de lo que manda el
      # navegador y que las filas de usuario no se cuelen entre las fichas.
      - name: Probar el carrito y los pedidos
        run: npm run probar-tienda
